# Canonical CI/CD — imports the shared hanzoai/ci reusable workflow. All real config
# (images, test, deploy) lives in the repo-root hanzo.yml; this file is just the trigger
# + the import. Same shape every hanzo/lux/zoo repo uses. Runs on our arc pool (zero GHA
# minutes); deploy fires only on `main` per hanzo.yml. PRs build+test but never deploy.
name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    secrets: inherit
